<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Glow Hexagon/Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="12 12" />

  <!-- Nexus AI Central Symbol (Stylized Zap + AI Diamond) -->
  <g filter="url(#glow)">
    <!-- Backing diamond -->
    <path d="M 256 100 L 370 214 L 256 328 L 142 214 Z" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" stroke-opacity="0.6" />
    <!-- Dynamic Lightning Bolt -->
    <path d="M 276 136 L 196 264 L 252 264 L 236 376 L 316 248 L 260 248 Z" fill="url(#primaryGrad)" />
    <!-- Spark Dot Core -->
    <circle cx="256" cy="256" r="8" fill="#ffffff" />
  </g>

  <!-- Subtitle Text / Tech details -->
  <text x="256" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="6">NEXUS AI</text>
</svg>
